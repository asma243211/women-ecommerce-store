<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout — LUMERA</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/auth.css"></head><body><header class="site-header"><a class="logo" href="index.html">LUMERA<span>.</span></a><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="shop.html?category=Watches">Watches</a></nav><div class="checkout-secure">Secure demo checkout</div><button id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light mode">🌙</button></header><main class="checkout"><form id="checkoutForm"><div class="checkout-card"><p class="eyebrow">1 · CONTACT</p><h2>Customer details</h2><input name="name" placeholder="Full name" required><input name="phone" placeholder="Phone number" required><input type="email" name="email" placeholder="Email address" required></div><div class="checkout-card"><p class="eyebrow">2 · DELIVERY</p><h2>Shipping address</h2><input name="address" placeholder="Street / area" required><div class="two"><input name="city" placeholder="City" required><input name="postal" placeholder="Postal code" required></div></div><div class="checkout-card"><p class="eyebrow">3 · PAYMENT</p><h2>Payment method</h2><label class="payment"><input type="radio" name="payment" value="Cash on Delivery" checked> Cash on Delivery</label><label class="payment"><input type="radio" name="payment" value="bKash"> bKash (demo)</label><label class="payment"><input type="radio" name="payment" value="Nagad"> Nagad (demo)</label><button class="btn wide" type="submit">Place demo order</button></div></form><aside class="summary" id="checkoutSummary"></aside></main><script src="js/app.js"></script><script src="js/auth.js"></script><script src="js/checkout.js"></script></body></html>
